# Enable pnpm via Corepack from package.json `packageManager`, optionally cache
# the pnpm store. Prefer this over pnpm/action-setup (especially version: latest —
# floating tags have broken CI; see pnpm/action-setup#276).
#
# Call after actions/setup-node. Do not set cache: 'pnpm' on setup-node — this
# action owns store-path discovery and actions/cache.
#
# Pin a full SHA that is on main (merge commit), not a PR branch tip. Example
# (main tip as of repository-helpers#363):
#   uses: the-hcma/repository-helpers/actions/setup-pnpm-corepack@cde3063aa1e030fcac59bbf215131a3bd25d7908
# See README.md for path-filter gotcha, working-directory: web, and Dependabot notes.
name: 'Setup pnpm via Corepack'
description: >-
  Enable Corepack pnpm from packageManager and cache the pnpm store
  (hides store-path / actions/cache boilerplate).
inputs:
  working-directory:
    description: >-
      Directory containing package.json and pnpm-lock.yaml (use 'web' for nested
      packageManager, e.g. domesti-bot).
    required: false
    default: '.'
  cache:
    description: Cache the pnpm store with actions/cache
    required: false
    default: 'true'
  lockfile-path:
    description: >-
      Lockfile path relative to working-directory (default pnpm-lock.yaml).
      Used for the cache key when cache is true.
    required: false
    default: 'pnpm-lock.yaml'
runs:
  using: composite
  steps:
    - name: Enable Corepack and activate packageManager pnpm
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if ! command -v corepack >/dev/null 2>&1; then
          echo 'ERROR: corepack not found; run actions/setup-node first' >&2
          exit 1
        fi
        if [[ ! -f package.json ]]; then
          echo "ERROR: package.json not found in working-directory '${{ inputs.working-directory }}'" >&2
          exit 1
        fi
        package_manager="$(node -p "require('./package.json').packageManager || ''")"
        if [[ ! "$package_manager" =~ ^pnpm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "ERROR: package.json packageManager must be exact pnpm@X.Y.Z (got: '${package_manager:-empty}')" >&2
          exit 1
        fi
        corepack enable
        corepack prepare "$package_manager" --activate
        pnpm --version

    - name: Resolve pnpm store path
      if: inputs.cache == 'true'
      id: pnpm-cache
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        store_path="$(pnpm store path)"
        echo "path=${store_path}" >>"${GITHUB_OUTPUT}"

    - name: Cache pnpm store
      if: inputs.cache == 'true'
      uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.pnpm-cache.outputs.path }}
        key: >-
          pnpm-store-${{ runner.os }}-${{ inputs.working-directory }}-${{
            hashFiles(format('{0}/{1}', inputs.working-directory, inputs.lockfile-path))
          }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ inputs.working-directory }}-
