# Make the repository-helpers checkout that GitHub already downloaded for this action
# available to later steps, so consumer CI wrappers can run scripts/dev/with-tmp-layout
# (temp files under $TMPDIR/<project>/<branch>/<tool>, repository-helpers#832).
#
# Pin a full SHA that is on main (merge commit), like setup-pnpm-corepack:
#   uses: the-hcma/repository-helpers/actions/setup-tmp-layout@<sha>
# The step needs no token: a runner downloads the whole repository at the pinned ref to run
# any action in it, so no clone of a private repository is needed.
name: 'Setup tmp layout'
description: >-
  Export REPOSITORY_HELPERS_DIR (this action's own repository checkout) so CI wrappers can use
  scripts/dev/with-tmp-layout.
runs:
  using: composite
  steps:
    - name: Export REPOSITORY_HELPERS_DIR
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        helpers_dir="$(cd "$ACTION_PATH/../.." && pwd)"
        if [[ ! -x "$helpers_dir/scripts/dev/with-tmp-layout" ]]; then
          echo "ERROR: $helpers_dir/scripts/dev/with-tmp-layout not found; pin a SHA that has it" >&2
          exit 1
        fi
        # Multiline form with a delimiter no path can contain, so an odd work directory cannot break the file.
        delimiter="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
        {
          printf 'REPOSITORY_HELPERS_DIR<<%s\n' "$delimiter"
          printf '%s\n' "$helpers_dir"
          printf '%s\n' "$delimiter"
        } >> "$GITHUB_ENV"
