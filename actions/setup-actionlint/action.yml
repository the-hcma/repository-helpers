# Install a pinned, checksum-verified actionlint with a download retry that outlasts a short
# github.com release outage (repository-helpers#842). Replaces
#   curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
# which fetches a branch-tip script and fails the job on the first bad response.
#
# Pin a full SHA that is on main (merge commit), like setup-pnpm-corepack:
#   uses: the-hcma/repository-helpers/actions/setup-actionlint@<sha>
# The step needs no token: a runner downloads the whole repository at the pinned ref to run any action
# in it.
name: 'Setup actionlint'
description: >-
  Install a pinned actionlint release (SHA-256 verified, bounded retries with backoff) to
  /usr/local/bin.
runs:
  using: composite
  steps:
    - name: Install actionlint
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        helpers_dir="$(cd "$ACTION_PATH/../.." && pwd)"
        if [[ ! -x "$helpers_dir/scripts/lib/ci-actionlint" ]]; then
          echo "ERROR: $helpers_dir/scripts/lib/ci-actionlint not found or not executable; check the pinned SHA and file permissions" >&2
          exit 1
        fi
        "$helpers_dir/scripts/lib/ci-actionlint"
