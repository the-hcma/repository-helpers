name: Cleanup Branch On Merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete merged PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Dependency-free on purpose: the runner has gh but no repository-helpers checkout, so the
        # scripts/gh-api wrapper cannot be required here. The call has its own timeout instead.
        # Keep this as the last block of the file: tests/cleanup-branch-on-merge-template.test runs it.
        # The default-branch guard is here, not in `if:`, because Actions compares strings without
        # case sensitivity and Git refs are case-sensitive (`MAIN` is not `main`).
        run: |
          if [ "${BRANCH}" = "${DEFAULT_BRANCH}" ]; then
            echo "Not deleting the default branch ${BRANCH}"
            exit 0
          fi
          status=0
          output="$(timeout 60 gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${BRANCH}" 2>&1)" || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "Deleted branch ${BRANCH}"
          elif [ "${status}" -eq 124 ]; then
            echo "::error::Timed out deleting branch ${BRANCH}"
            exit 1
          elif printf '%s' "${output}" | grep -qi 'reference does not exist'; then
            echo "Branch ${BRANCH} was already deleted"
          else
            echo "::error::Could not delete branch ${BRANCH}: ${output}"
            exit 1
          fi
