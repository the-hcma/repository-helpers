name: Close Graphite-Merged PRs

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  close-merged-pr:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'graphite-app' &&
      contains(github.event.comment.body, 'Graphite merge queue')
    runs-on: ubuntu-latest

    steps:
      - name: Close PR already landed by Graphite merge queue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          state="$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json state --jq .state)"
          if [[ "${state}" == "OPEN" ]]; then
            gh pr close "${PR_NUMBER}" --repo "${REPOSITORY}" \
              --comment "Closing because Graphite merge queue already landed this change on main."
          fi
