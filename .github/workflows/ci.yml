name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: shellcheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get install -y ripgrep
          npm install -g @withgraphite/graphite-cli

      - name: Syntax check
        run: bash -n scripts/dep-updater scripts/dep-updater-notifier scripts/lib/time-log scripts/setup-service scripts/dev/start-development tests/dep-updater.test tests/dep-updater-notifier.test tests/lib/test-assert tests/setup-service.test tests/start-development.test tests/time-log.test

      - name: Shellcheck
        run: shellcheck -S info scripts/dep-updater scripts/dep-updater-notifier scripts/lib/time-log scripts/setup-service scripts/dev/start-development tests/dep-updater.test tests/dep-updater-notifier.test tests/lib/test-assert tests/setup-service.test tests/start-development.test tests/time-log.test

      - name: Tests
        run: bash tests/dep-updater.test && bash tests/dep-updater-notifier.test && bash tests/setup-service.test && bash tests/start-development.test && bash tests/time-log.test
