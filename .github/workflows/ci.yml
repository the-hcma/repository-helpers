name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: shellcheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get install -y ripgrep
          npm install -g @withgraphite/graphite-cli

      - name: Syntax check
        run: bash -n dep-updater dep-updater.test

      - name: Shellcheck
        run: shellcheck -S info dep-updater dep-updater.test

      - name: Tests
        run: bash dep-updater.test
