name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Skip merge-queue staging branches — the merge queue validates the
          # integrated state itself; CI there duplicates work.
          if [[ "${HEAD_REF}" == gtmq_merge_* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${PR_NUMBER}" ]]; then
            state=$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json state -q .state 2>/dev/null || true)
            if [[ "${state}" == "MERGED" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  check:
    name: shellcheck + tests
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get install -y ripgrep
          actionlint_version=1.7.9
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/actionlint_${actionlint_version}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          npm install -g @withgraphite/graphite-cli

      - name: Syntax check
        run: |
          files=()
          for f in scripts/* scripts/dev/* scripts/lib/* tests/* tests/lib/*; do
            [[ -f "$f" ]] || continue
            files+=("$f")
          done
          bash -n "${files[@]}"

      - name: Shellcheck
        run: |
          files=()
          for f in scripts/* scripts/dev/* scripts/lib/* tests/* tests/lib/*; do
            [[ -f "$f" ]] || continue
            files+=("$f")
          done
          shellcheck -S info "${files[@]}"

      - name: Actionlint
        run: |
          actionlint .github/workflows/*.yml scripts/lib/repo-practices-workflows/*.yml

      - name: Tests
        run: |
          for t in tests/*.test; do
            bash "$t"
          done
