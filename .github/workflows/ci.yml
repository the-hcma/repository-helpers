name: CI

on:
  push:
    branches-ignore:
      - main
      - '**/graphite-base/**'
      # GitHub merge queue temporary branches — use merge_group, not push.
      - 'gh-readonly-queue/**'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event.action || github.event_name }}
  cancel-in-progress: true

# Read-only token by default; `guard` widens to pull-requests: read for `gh pr`.
# The `check` job runs a release-downloaded shellcheck (#594) — no write scope.
permissions:
  contents: read

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Skip merge-queue staging branches — the merge queue validates the
          # integrated state itself; CI there duplicates work.
          if [[ "${HEAD_REF}" == gtmq_merge_* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Skip when the PR is already merged — Graphite pushes a restack
          # commit to the next branch after a merge lands, which would otherwise
          # trigger a redundant CI run on an already-validated diff.
          if [[ -n "${PR_NUMBER}" ]]; then
            state=$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json state -q .state 2>/dev/null || true)
            if [[ "${state}" == "MERGED" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # CodeRabbit appends review summaries to the PR description (pull_request
          # edited). We want its review comments only, not a second full CI run.
          if [[ "${{ github.event_name }}" == "pull_request" ]] \
              && [[ "${{ github.event.action }}" == "edited" ]] \
              && [[ "${{ github.event.sender.login }}" == "coderabbitai[bot]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Pull request CI skipped: CodeRabbit description edit (review metadata only)"
            exit 0
          fi

          # Skip push CI when an open PR already covers this branch.
          # GitHub always delivers pull_request synchronize for PR-head pushes;
          # the push trigger is only for restacks without an open PR.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            PR_COUNT=0
            if count="$(gh pr list --repo "$GITHUB_REPOSITORY" \
                --head "$BRANCH" --state open \
                --json number --jq 'length' 2>/dev/null)"; then
              PR_COUNT="$count"
            fi
            if [[ "$PR_COUNT" -gt 0 ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Push CI skipped: open PR exists; pull_request handles this push"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
  check:
    name: shellcheck + tests
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get install -y ripgrep
          actionlint_version=1.7.9
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/actionlint_${actionlint_version}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          npm install -g @withgraphite/graphite-cli

      - name: Syntax check
        run: |
          files=()
          for f in scripts/* scripts/dev/* scripts/lib/* scripts/lib/*/* tests/* tests/lib/*; do
            [[ -f "$f" ]] || continue
            case "$f" in
              *.py|*.md|*.mdc|*.snippet|*.txt|*.yml|*.yaml|*.json|*.toml|*.rs|*.ts|*.tsx|*.js|*.jsx|*.css|*.html|*.svg) continue ;;
            esac
            first_line=''
            IFS= read -r first_line <"$f" || true
            if [[ "$first_line" == '#!'* ]]; then
              case "$first_line" in
                *bash*|*/sh*|*'/env sh'*|*dash*|*ash*) ;;
                *) continue ;;
              esac
            fi
            files+=("$f")
          done
          bash -n "${files[@]}"

      - name: Shellcheck
        run: |
          # Pin shellcheck via the canonical lib so local pre-pr-checks and CI
          # always run the same version (repository-helpers#594).
          source scripts/lib/ci-shellcheck
          ci_shellcheck_ensure
          shellcheck --version
          ci_shellcheck_run .

      - name: Actionlint
        run: |
          actionlint .github/workflows/*.yml scripts/lib/repo-practices-workflows/*.yml

      - name: Tests
        run: |
          for t in tests/*.test; do
            bash "$t"
          done
  secret-scan:
    name: Secret Scan
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Secret Scan
        env:
          GITLEAKS_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          GITLEAKS_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: bash .github/ci/secret-scan