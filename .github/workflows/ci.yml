name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: shellcheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get install -y ripgrep
          npm install -g @withgraphite/graphite-cli

      - name: Syntax check
        run: bash -n scripts/* scripts/dev/* tests/* tests/lib/*

      - name: Shellcheck
        run: shellcheck -S info scripts/* scripts/dev/* tests/* tests/lib/*

      - name: Tests
        run: |
          for t in tests/*.test; do
            bash "$t"
          done
