name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: shellcheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get install -y ripgrep
          npm install -g @withgraphite/graphite-cli

      - name: Syntax check
        run: |
          files=()
          for f in scripts/* scripts/dev/* scripts/lib/* tests/* tests/lib/*; do
            [[ -f "$f" ]] || continue
            files+=("$f")
          done
          bash -n "${files[@]}"

      - name: Shellcheck
        run: |
          files=()
          for f in scripts/* scripts/dev/* scripts/lib/* tests/* tests/lib/*; do
            [[ -f "$f" ]] || continue
            files+=("$f")
          done
          shellcheck -S info "${files[@]}"

      - name: Tests
        run: |
          for t in tests/*.test; do
            bash "$t"
          done
