name: CI

on:
  push:
    branches-ignore:
      - main
      - '**/graphite-base/**'
  pull_request:
      types: [opened, reopened, synchronize, ready_for_review, edited]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Skip merge-queue staging branches — the merge queue validates the
          # integrated state itself; CI there duplicates work.
          if [[ "${HEAD_REF}" == gtmq_merge_* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${PR_NUMBER}" ]]; then
            state=$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json state -q .state 2>/dev/null || true)
            if [[ "${state}" == "MERGED" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi


          # Skip push CI when pull_request CI is already queued for this SHA.
          # Both events fire on every PR-branch push; only pull_request checks
          # should run so we avoid duplicate work without cross-cancelling runs.
          # If no pull_request run appears (e.g. gt sync restack), push CI runs.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            PR_COUNT=$(gh pr list --repo "$GITHUB_REPOSITORY" \
              --head "${GITHUB_REPOSITORY_OWNER}:${BRANCH}" --state open \
              --json number --jq 'length')
            if [[ "$PR_COUNT" -gt 0 ]]; then
              for _ in 1 2 3 4 5 6; do
                RUNS=$(gh api \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=pull_request&per_page=1" \
                  --jq '.total_count')
                if [[ "$RUNS" -gt 0 ]]; then
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  echo "Push CI skipped: pull_request workflow covers ${GITHUB_SHA}"
                  exit 0
                fi
                sleep 10
              done
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
  check:
    name: shellcheck + tests
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install dependencies
        run: |
          sudo apt-get install -y ripgrep
          actionlint_version=1.7.9
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/actionlint_${actionlint_version}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          npm install -g @withgraphite/graphite-cli

      - name: Syntax check
        run: |
          files=()
          for f in scripts/* scripts/dev/* scripts/lib/* tests/* tests/lib/*; do
            [[ -f "$f" ]] || continue
            files+=("$f")
          done
          bash -n "${files[@]}"

      - name: Shellcheck
        run: |
          files=()
          for f in scripts/* scripts/dev/* scripts/lib/* tests/* tests/lib/*; do
            [[ -f "$f" ]] || continue
            files+=("$f")
          done
          shellcheck -S info "${files[@]}"

      - name: Actionlint
        run: |
          actionlint .github/workflows/*.yml scripts/lib/repo-practices-workflows/*.yml

      - name: Tests
        run: |
          for t in tests/*.test; do
            bash "$t"
          done
  secret-scan:
    name: Secret Scan
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Secret Scan
        env:
          GITLEAKS_BASE: ${{ github.event.pull_request.base.sha || '' }}
          GITLEAKS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/ci/secret-scan
