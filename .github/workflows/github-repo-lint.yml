name: GitHub Repo Lint

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .cursor/rules/**
      - scripts/lib/repo-practices
      - scripts/lib/repo-practices-cursor/**
  push:
    branches:
      - main
    paths:
      - .cursor/rules/**
      - scripts/lib/repo-practices
      - scripts/lib/repo-practices-cursor/**

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: github-repo-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  org-practices-audit:
    name: org repo-practices audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get install -y jq ripgrep

      - name: Org-wide repo-practices audit
        env:
          GH_TOKEN: ${{ github.token }}
          NO_COLOR: '1'
        run: |
          org="${GITHUB_REPOSITORY%%/*}"
          scripts/github-repo-lint --org "$org" --all --strict-onboarding --compact
