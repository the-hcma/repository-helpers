name: GitHub Repo Lint

# Full org audit matching local:
#   scripts/github-repo-lint --org ORG --all --strict-onboarding --compact
#
# github.token is repo-scoped: sibling merge settings come back null and classic
# branch protection returns HTTP 403. Use repo/org secret GITHUB_REPO_LINT_TOKEN
# (classic PAT with `repo`, or fine-grained admin:read + contents:read on every
# org repo) so CI sees the same APIs as a local `gh` login.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .cursor/rules/**
      - .github/workflows/github-repo-lint.yml
      - scripts/lib/repo-practices
      - scripts/lib/repo-practices-cursor/**
  push:
    branches:
      - main
    paths:
      - .cursor/rules/**
      - .github/workflows/github-repo-lint.yml
      - scripts/lib/repo-practices
      - scripts/lib/repo-practices-cursor/**
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: github-repo-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  org-practices-audit:
    name: org repo-practices audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get install -y jq ripgrep

      - name: Org-wide repo-practices audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_REPO_LINT_TOKEN }}
          NO_COLOR: '1'
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            printf '%s\n' \
              'ERROR: GITHUB_REPO_LINT_TOKEN secret is missing.' \
              'The default github.token cannot read sibling-repo merge settings or classic branch protection.' \
              'Add an org or repo secret GITHUB_REPO_LINT_TOKEN (same access as local gh: classic PAT repo scope, or fine-grained administration:read + contents:read on every org repo).'
            exit 1
          fi
          org="${GITHUB_REPOSITORY%%/*}"
          scripts/github-repo-lint --org "$org" --all --strict-onboarding --compact
