name: GitHub Repo Lint

# Full org audit matching local:
#   scripts/github-repo-lint --org ORG --all --strict-onboarding --compact
#
# Path filters skip the workflow unless org cursor rules (or this workflow /
# the enforcer) change. Create, update, and delete all show up as path changes.
# workflow_dispatch always runs.
#
# The job uses environment github-repo-lint (required reviewer). Approve the
# waiting run in the Actions UI; that unlocks environment secret REPO_LINT_TOKEN.
# The default github.token cannot read sibling-repo merge settings or classic
# branch protection.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .cursor/rules/**
      - .github/workflows/github-repo-lint.yml
      - scripts/lib/repo-practices
      - scripts/lib/repo-practices-cursor/**
  merge_group:
    paths:
      - .cursor/rules/**
      - .github/workflows/github-repo-lint.yml
      - scripts/lib/repo-practices
      - scripts/lib/repo-practices-cursor/**
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: github-repo-lint-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  org-practices-audit:
    name: org repo-practices audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-repo-lint
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get install -y jq ripgrep

      - name: Org-wide repo-practices audit
        env:
          GH_TOKEN: ${{ secrets.REPO_LINT_TOKEN }}
          NO_COLOR: '1'
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            printf '%s\n' \
              'ERROR: environment secret REPO_LINT_TOKEN is missing.' \
              'Add it on environment github-repo-lint (same access as local gh).'
            exit 1
          fi
          org="${GITHUB_REPOSITORY%%/*}"
          scripts/github-repo-lint --org "$org" --all --strict-onboarding --compact
