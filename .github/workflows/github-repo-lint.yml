name: GitHub Repo Lint

# Full org audit matching local:
#   scripts/github-repo-lint --org ORG --all --strict-onboarding --compact
#
# The workflow (and therefore the environment approval) starts only when the
# PR diff touches org cursor rules or the enforcer that checks them. Create,
# update, and delete all appear in that path list. Unrelated PRs never queue
# a run and never ask for approval.
# workflow_dispatch is the explicit manual exception.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .cursor/rules/**
      - scripts/lib/repo-practices
      - scripts/lib/repo-practices-cursor/**
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: github-repo-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  org-practices-audit:
    name: org repo-practices audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-repo-lint
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get install -y jq ripgrep

      - name: Org-wide repo-practices audit
        env:
          GH_TOKEN: ${{ secrets.REPO_LINT_TOKEN }}
          NO_COLOR: '1'
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            printf '%s\n' \
              'ERROR: environment secret REPO_LINT_TOKEN is missing.' \
              'Add it on environment github-repo-lint (same access as local gh).'
            exit 1
          fi
          org="${GITHUB_REPOSITORY%%/*}"
          scripts/github-repo-lint --org "$org" --all --strict-onboarding --compact
