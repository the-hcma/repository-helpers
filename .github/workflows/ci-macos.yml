name: CI (macOS)

# The test suite on macOS, reported next to CI but never a required check (#871).
#
# The scripts run on macOS developer hosts as well as Linux batch hosts, and a test that only breaks on macOS
# (BSD pgrep, a host git config; repository-helpers#862) used to be found by a developer, not by CI.
#
# Why this is its own workflow and not a part of ci.yml: `github-repo-lint` derives the required status checks
# from the job names in ci.yml, and keeps every ci-part-* job that no rollup needs as a required context. A job
# in ci.yml therefore always ends up blocking. GitHub's macOS arm64 runners are capacity constrained ("The job
# was not acquired by Runner of type hosted even after multiple attempts" after 15 minutes in the queue), so a
# required macOS job could block every merge without a single test failing. Here a failure shows on the PR and
# is read before merging, and it never blocks the merge queue or the ci.yml rollup.
#
# Triggers are deliberately narrow because every run takes scarce runner capacity: pull requests (not
# `edited`, so a CodeRabbit description edit does not start one) and a manual run. No push, merge_group or
# schedule trigger.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests-macos:
    name: tests (macOS)
    # The label is pinned on purpose: GitHub retires macOS images, and a job on a retired label is cancelled
    # about a second after it starts ("The configuration 'macos-14-arm64-us-default' is not supported").
    # Bump it deliberately when GitHub retires macos-15.
    runs-on: macos-15
    timeout-minutes: 30
    # A draft PR does not use a macOS runner until it is ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the GNU userland the scripts document
        # What AGENTS.md tells a macOS developer to install (bash 5 for the scripts' shebang), put on PATH in
        # the order tooling_path_prepend_gnu_userland uses. procps is not installed: it cannot be on macOS, so
        # BSD pgrep and ps stay as they ship, which is what broke in #862.
        run: |
          brew install bash coreutils gnu-sed grep util-linux findutils ripgrep
          prefix="$(brew --prefix)"
          {
            echo "${prefix}/bin"
            for dir in util-linux/bin findutils/libexec/gnubin grep/libexec/gnubin \
              gnu-sed/libexec/gnubin coreutils/libexec/gnubin; do
              echo "${prefix}/opt/${dir}"
            done
          } >>"$GITHUB_PATH"

      - name: Tests
        run: scripts/dev/run-tests --jobs 3 --verbose
