name: Dep Updater

# Live org dry-run matching local:
#   scripts/dep-updater-ci-org-dry-run
#   → dep-updater --batch --all --dry-run --include-private --scan-root …
#
# The workflow (and therefore the environment approval) starts only when the
# PR diff touches dep-updater entrypoints or release-age defaults. Unrelated
# PRs never queue a run and never ask for approval.
# workflow_dispatch is the explicit manual exception.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/dep-updater.yml
      - scripts/dep-updater
      - scripts/dep-updater-batch-run
      - scripts/dep-updater-ci-org-dry-run
      - scripts/dep-updater-notifier
      - scripts/lib/release-age-defaults
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dep-updater-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  org-dry-run:
    name: org dep-updater dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dep-updater
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable

      - name: Install Graphite CLI
        run: |
          # Graphite-marked repos still require `gt` on PATH during dry-run
          # (check_core_prereqs); auth is skipped when --dry-run is set.
          npm install -g @withgraphite/graphite-cli

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install Rust toolchain and cargo-outdated
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          # shellcheck disable=SC1091
          source "${HOME}/.cargo/env"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          cargo install cargo-outdated --locked

      - name: Org-wide dep-updater dry-run
        env:
          GH_TOKEN: ${{ secrets.DEP_UPDATER_TOKEN }}
          NO_COLOR: '1'
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            printf '%s\n' \
              'ERROR: environment secret DEP_UPDATER_TOKEN is missing.' \
              'Add it on environment dep-updater (same access as local gh).'
            exit 1
          fi
          # rustup env for this step (GITHUB_PATH applies to later steps only).
          # shellcheck disable=SC1091
          source "${HOME}/.cargo/env"
          org="${GITHUB_REPOSITORY%%/*}"
          scripts/dep-updater-ci-org-dry-run --org "$org"
